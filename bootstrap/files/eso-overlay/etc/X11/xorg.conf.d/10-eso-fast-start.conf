# ESO: faster X start. Xorg compiles a full keyboard map (xkbcomp) for every device that calls itself a keyboard.
# These buttons are not keyboards and X never needs them: systemd-logind handles power, sleep and the lid.
# (Brightness and volume keys stay: on laptops they come from "Video Bus" and the keyboard itself.)
Section "InputClass"
    Identifier "eso: buttons handled by logind"
    MatchProduct "Power Button|Sleep Button|Lid Switch"
    Option "Ignore" "on"
EndSection
