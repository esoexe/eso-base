# ESO OS: QEMU's "VMware SVGA" imitation isn't real VMware hardware - vmwgfx would remove the firmware framebuffer and
# then refuse the device, leaving no display. On QEMU the firmware framebuffer + Xorg fbdev draw the desktop instead.
# Real VMware and VirtualBox (VMSVGA) load vmwgfx as usual.
install vmwgfx /bin/sh -c '[ "$(cat /sys/class/dmi/id/sys_vendor 2>/dev/null)" = QEMU ] || exec /usr/sbin/modprobe --ignore-install vmwgfx $CMDLINE_OPTS'
