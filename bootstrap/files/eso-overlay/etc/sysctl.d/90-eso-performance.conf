# ESO OS — responsiveness tuning (works from 1 GB to 256 GB RAM)
# zram is the swap device: swapping to compressed RAM is cheap, so keep more page cache
vm.swappiness = 150
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
# small dirty-page limits: big copies never freeze the desktop
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# keep some memory free so allocations never stall
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# no NMI watchdog (wakeups) and faster, smoother scheduling of desktop tasks
kernel.nmi_watchdog = 0
kernel.sched_autogroup_enabled = 1
# games (Proton/Wine, e.g. many Steam titles) need many memory maps
vm.max_map_count = 2147483642
# lots of files watched by IDEs / VS Code
fs.inotify.max_user_watches = 524288
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
