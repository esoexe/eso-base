name: "ESO OS - full-screen demo recording (newest ISO, 1920x1080, 30 fps, driven like a user)"
on:
  workflow_dispatch:
    inputs:
      boot_wait:
        description: "seconds from power-on before the demo starts"
        default: "38"
      phase:
        description: "demo = the recording; bootdiag = input diagnostics after boot; closediag = Alt+F4 shell test"
        default: "demo"
permissions:
  actions: read
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Newest ESO OS ISO (artifact of the ISO workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          N=eso-os-iso-x86_64
          id=$(GITHUB_REPOSITORY="${{ github.repository }}" python3 bootstrap/ci/newest-artifact.py $N)
          [ -n "$id" ] || { echo "no $N artifact"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o i.zip \
               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip"
          unzip -q i.zip && rm i.zip && sha256sum -c eso-os-x86_64.iso.sha256
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso qemu-system-x86 qemu-system-gui socat ffmpeg xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils >/dev/null
      - name: Boot + drive + record the full screen
        env:
          DEMO_BOOT_WAIT: ${{ github.event.inputs.boot_wait }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ACC=$([ -w /dev/kvm ] && echo "-enable-kvm -cpu host" || echo "-cpu max"); echo "acceleration: $ACC"
          xorriso -osirrox on -indev eso-os-x86_64.iso -extract /boot/vmlinuz vmlinuz -extract /boot/initrd.img initrd.img 2>/dev/null
          # The guest gets a 1920x1080 monitor (EDID). QEMU shows it in its own full-screen window on a real 60 Hz
          # virtual screen (Xorg "dummy" driver: QEMU refreshes its window at the screen's rate; Xvfb reports 0 Hz, so
          # QEMU fell back to ~33 updates/s), and that screen is filmed at 60 fps from OUTSIDE the VM: nothing runs in
          # ESO for the film and nothing pauses the VM (QMP screendump films paused it and reached only ~24 frames/s).
          cat > dummy.conf <<'XC'
          Section "Device"
              Identifier "d"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "m"
              HorizSync 5.0-1000.0
              VertRefresh 5.0-200.0
              Modeline "1920x1080_60" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
          EndSection
          Section "Screen"
              Identifier "s"
              Device "d"
              Monitor "m"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1920x1080_60"
              EndSubSection
          EndSection
          XC
          sudo Xorg :99 -ac -noreset -nolisten tcp -config "$PWD/dummy.conf" -logfile "$PWD/xorg.log" vt7 >/dev/null 2>&1 & xv=$!
          for i in $(seq 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          export DISPLAY=:99
          xrandr 2>&1 | head -3
          qemu-system-x86_64 $ACC -m 4096 -smp 4 -vga none -device VGA,edid=on,xres=1920,yres=1080 \
            -device qemu-xhci -device usb-tablet \
            -cdrom eso-os-x86_64.iso -kernel vmlinuz -initrd initrd.img \
            -append "eso.live eso.label=ESO_OS quiet loglevel=3 splash vt.global_cursor_default=0 udev.log_level=3 console=ttyS0,115200 console=tty0" \
            -display gtk,zoom-to-fit=off,show-menubar=off,show-tabs=off,gl=off -full-screen \
            -serial file:boot.log -qmp unix:qmp.sock,server,nowait -no-reboot & q=$!
          sleep 0.5
          ffmpeg -loglevel error -y -f x11grab -framerate 60 -video_size 1920x1080 -draw_mouse 0 -i :99 \
            -c:v libx264 -preset ultrafast -crf 16 -threads 2 demo-raw.mkv & ff=$!
          DEMO_PHASE="${{ github.event.inputs.phase }}" python3 bootstrap/ci/demo-drive.py qmp.sock shots 1920 1080 | tee drive.log
          sleep 1; kill -INT $ff 2>/dev/null || true; wait $ff 2>/dev/null || true
          # not recorded: a quick diagnostic inside the VM (screenshots only)
          [ "${{ github.event.inputs.phase }}" != demo ] || DEMO_PHASE=diag python3 bootstrap/ci/demo-drive.py qmp.sock shots 1920 1080 | tee -a drive.log || true
          kill $q 2>/dev/null || true; sleep 1; sudo kill $xv 2>/dev/null || true
          grep -E "Modeline|dummy.*[0-9]+x[0-9]+" xorg.log | head -3 || true
          ffmpeg -loglevel error -y -i demo-raw.mkv -c:v libx264 -preset slow -crf 22 -r 60 -pix_fmt yuv420p -movflags +faststart eso-os-demo-1080p.mp4
          # how many DIFFERENT frames per second the film has while things move (60 = every frame is new)
          python3 - <<'PY' || true
          import re, subprocess, statistics
          out = subprocess.run(["ffmpeg", "-hide_banner", "-i", "eso-os-demo-1080p.mp4", "-vf", "mpdecimate=hi=64*2:lo=64:frac=0.05,showinfo", "-f", "null", "-"], capture_output=True, text=True).stderr
          ts = [float(x) for x in re.findall(r"pts_time:([0-9.]+)", out)]
          best = 0
          for i in range(len(ts)):
              j = i
              while j < len(ts) and ts[j] - ts[i] < 1.0: j += 1
              best = max(best, j - i)
          runs, cur = [], []
          for a, b in zip(ts, ts[1:]):
              g = (b - a) * 1000
              if g < 70: cur.append(g)
              else:
                  if len(cur) > 30: runs.append(cur)
                  cur = []
          if len(cur) > 30: runs.append(cur)
          moving = [g for r in runs for g in r]
          if moving:
              print(f"film: busiest second {best} different frames; while moving: {1000 * len(moving) / sum(moving):.1f} frames/s, "
                    f"frame gap p50 {statistics.median(moving):.0f} ms, gaps over 20 ms: {sum(g > 20 for g in moving)} of {len(moving)}")
          PY
          echo "visible picture area (must be crop=1920:1080:0:0):"
          ffmpeg -hide_banner -ss 60 -i eso-os-demo-1080p.mp4 -t 3 -vf cropdetect=24:2:0 -f null - 2>&1 | grep -o 'crop=[0-9:]*' | sort | uniq -c | sort -rn | head -3
          ffprobe -v error -show_entries format=duration,size:stream=r_frame_rate,width,height -of compact eso-os-demo-1080p.mp4
          for f in shots/*.ppm; do ffmpeg -loglevel error -y -i "$f" "${f%.ppm}.png" && rm "$f"; done
          grep -a "ESO OS" boot.log | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: eso-os-demo-recording
          path: |
            eso-os-demo-1080p.mp4
            xorg.log
            shots/*.png
            drive.log
            boot.log
            shots/HEALTH
          retention-days: 14
      - name: Desktop health gate
        if: github.event.inputs.phase == 'demo'
        run: |
          cat shots/HEALTH 2>/dev/null || echo "no health result"
          grep -q '^OK' shots/HEALTH
