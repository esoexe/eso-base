name: "ESO OS - full-screen demo recording (newest ISO, 1920x1080, 30 fps, driven like a user)"
on:
  workflow_dispatch:
    inputs:
      boot_wait:
        description: "seconds from power-on before the demo starts"
        default: "38"
      phase:
        description: "demo = the recording; bootdiag = input diagnostics after boot; closediag = Alt+F4 shell test"
        default: "demo"
permissions:
  actions: read
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Newest ESO OS ISO (artifact of the ISO workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          N=eso-os-iso-x86_64
          id=$(GITHUB_REPOSITORY="${{ github.repository }}" python3 bootstrap/ci/newest-artifact.py $N)
          [ -n "$id" ] || { echo "no $N artifact"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o i.zip \
               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip"
          unzip -q i.zip && rm i.zip && sha256sum -c eso-os-x86_64.iso.sha256
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso qemu-system-x86 qemu-system-gui socat ffmpeg xvfb tigervnc-viewer >/dev/null
      - name: Boot + drive + record the full screen
        env:
          DEMO_BOOT_WAIT: ${{ github.event.inputs.boot_wait }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ACC=$([ -w /dev/kvm ] && echo "-enable-kvm -cpu host" || echo "-cpu max"); echo "acceleration: $ACC"
          xorriso -osirrox on -indev eso-os-x86_64.iso -extract /boot/vmlinuz vmlinuz -extract /boot/initrd.img initrd.img 2>/dev/null
          # The guest gets a 1920x1080 monitor (EDID) and uses it. QEMU serves its screen over VNC and a full-screen
          # VNC viewer shows it 1:1 on the 1920x1080 virtual screen (tested: SDL letterboxed the desktop into a
          # 640x360 / 1280x752 box and GTK stretched it; VNC is pixel-exact).
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/dev/null 2>&1 & xv=$!
          for i in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          export DISPLAY=:99 SDL_VIDEO_X11_XRANDR=0
          qemu-system-x86_64 $ACC -m 4096 -smp 4 -vga none -device VGA,edid=on,xres=1920,yres=1080 \
            -device qemu-xhci -device usb-tablet \
            -cdrom eso-os-x86_64.iso -kernel vmlinuz -initrd initrd.img \
            -append "eso.live eso.label=ESO_OS quiet loglevel=3 splash vt.global_cursor_default=0 udev.log_level=3 console=ttyS0,115200 console=tty0" \
            -display none -vnc 127.0.0.1:3 -serial file:boot.log -qmp unix:qmp.sock,server,nowait -qmp unix:rec.sock,server,nowait -no-reboot & q=$!
          # filmed straight from the VM's framebuffer (whole frames, 60 fps): what ESO OS really draws
          python3 bootstrap/ci/qmp-record.py rec.sock demo-raw.mp4 60 & ff=$!
          sleep 1
          xtigervncviewer -FullScreen -RemoteResize=0 -Shared -MenuKey= 127.0.0.1:3 >vncviewer.log 2>&1 &
          DEMO_PHASE="${{ github.event.inputs.phase }}" python3 bootstrap/ci/demo-drive.py qmp.sock shots 1920 1080 | tee drive.log
          sleep 1; kill -INT $ff 2>/dev/null || true; wait $ff 2>/dev/null || true
          # not recorded: a quick diagnostic inside the VM (screenshots only)
          [ "${{ github.event.inputs.phase }}" != demo ] || DEMO_PHASE=diag python3 bootstrap/ci/demo-drive.py qmp.sock shots 1920 1080 | tee -a drive.log || true
          kill $q 2>/dev/null || true; sleep 1; kill $xv 2>/dev/null || true
          ffmpeg -loglevel error -y -i demo-raw.mp4 -c:v libx264 -preset slow -crf 23 -pix_fmt yuv420p -movflags +faststart eso-os-demo-1080p.mp4
          echo "visible picture area (must be crop=1920:1080:0:0):"
          ffmpeg -hide_banner -ss 60 -i eso-os-demo-1080p.mp4 -t 3 -vf cropdetect=24:2:0 -f null - 2>&1 | grep -o 'crop=[0-9:]*' | sort | uniq -c | sort -rn | head -3
          ffprobe -v error -show_entries format=duration,size:stream=r_frame_rate,width,height -of compact eso-os-demo-1080p.mp4
          for f in shots/*.ppm; do ffmpeg -loglevel error -y -i "$f" "${f%.ppm}.png" && rm "$f"; done
          grep -a "ESO OS" boot.log | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: eso-os-demo-recording
          path: |
            eso-os-demo-1080p.mp4
            shots/*.png
            drive.log
            boot.log
            shots/HEALTH
          retention-days: 14
      - name: Desktop health gate
        if: github.event.inputs.phase == 'demo'
        run: |
          cat shots/HEALTH 2>/dev/null || echo "no health result"
          grep -q '^OK' shots/HEALTH
