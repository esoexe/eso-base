name: "Demo recorder - QEMU 8.2.2 with a fixed 60 Hz refresh and direct frame output"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build python3-venv libglib2.0-dev libpixman-1-dev libgtk-3-dev libslirp-dev libfdt-dev zlib1g-dev flex bison pkg-config >/dev/null
      - name: Build
        run: |
          set -e
          curl -fsSL -o q.tar.xz https://download.qemu.org/qemu-8.2.2.tar.xz
          tar xf q.tar.xz && cd qemu-8.2.2
          python3 ../bootstrap/ci/qemu-eso-recorder.py ui/console.c
          mkdir b && cd b
          ../configure --prefix=/opt/qemu-eso --target-list=x86_64-softmmu --enable-kvm --enable-gtk --enable-slirp \
            --disable-docs --disable-werror --disable-opengl --disable-sdl --disable-xen --disable-tools \
            --disable-guest-agent --disable-capstone >/dev/null
          make -j$(nproc) >/dev/null
          sudo make install >/dev/null
          /opt/qemu-eso/bin/qemu-system-x86_64 --version
          strings /opt/qemu-eso/bin/qemu-system-x86_64 | grep -c "eso-recorder"
          tar -C /opt -czf $GITHUB_WORKSPACE/qemu-eso.tgz qemu-eso
          ls -la $GITHUB_WORKSPACE/qemu-eso.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-eso-recorder
          path: qemu-eso.tgz
          retention-days: 90
