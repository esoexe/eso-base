name: "ESO OS - recording display test (which capture gives a 1:1 1920x1080 picture) + click timeline"
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Newest ESO OS ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=eso-os-iso-x86_64&per_page=1" \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifacts"][0]["id"])')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o i.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip"
          unzip -q i.zip && rm i.zip
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso qemu-system-x86 qemu-system-gui ffmpeg xvfb tigervnc-viewer >/dev/null
      - name: Four display methods side by side
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          qemu-system-x86_64 --version | head -1
          xorriso -osirrox on -indev eso-os-x86_64.iso -extract /boot/vmlinuz vmlinuz -extract /boot/initrd.img initrd.img 2>/dev/null
          mkdir -p out
          vm() {  # $1 name, $2 display, rest: qemu display args
            n=$1 d=$2; shift 2
            Xvfb :$d -screen 0 1920x1080x24 -nolisten tcp >/dev/null 2>&1 &
            for i in $(seq 50); do [ -S /tmp/.X11-unix/X$d ] && break; sleep 0.1; done
            DISPLAY=:$d qemu-system-x86_64 -enable-kvm -cpu host -m 3072 -smp 2 -vga none -device VGA,edid=on,xres=1920,yres=1080 \
              -device qemu-xhci -device usb-tablet -cdrom eso-os-x86_64.iso -kernel vmlinuz -initrd initrd.img \
              -append "eso.live eso.label=ESO_OS quiet loglevel=3 splash vt.global_cursor_default=0 udev.log_level=3" \
              -qmp unix:out/$n.sock,server,nowait -no-reboot "$@" > out/$n.qemu.log 2>&1 &
          }
          vm sdlfs 91 -display sdl,show-cursor=off -full-screen
          vm gtkfs 92 -display gtk,full-screen=on,show-cursor=off,zoom-to-fit=off,show-tabs=off
          vm vnc 93 -display none -vnc 127.0.0.1:3
          vm sdlwin 94 -display sdl,show-cursor=off,window-close=off
          (sleep 25; DISPLAY=:93 xtigervncviewer -FullScreen -RemoteResize=0 -Shared -MenuKey= 127.0.0.1:3 > out/vncviewer.log 2>&1) &
          python3 bootstrap/ci/click-timeline.py out/sdlfs.sock out/clicks 30 72 | tee out/click-timeline.log &
          ct=$!
          for t in 50 80; do
            sleep $(( t == 50 ? 50 : 30 ))
            for v in sdlfs:91 gtkfs:92 vnc:93 sdlwin:94; do
              ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :${v#*:}.0 -frames:v 1 out/${v%:*}-$t.png
              echo "$t s ${v%:*}: $(ffmpeg -hide_banner -loop 1 -i out/${v%:*}-$t.png -t 0.3 -vf cropdetect=24:2:0 -f null - 2>&1 | grep -o 'crop=[0-9:]*' | tail -1)" | tee -a out/crop.txt
            done
          done
          wait $ct || true
          for f in out/clicks/*.ppm; do [ -e "$f" ] && ffmpeg -loglevel error -y -i "$f" "${f%.ppm}.png" && rm "$f"; done
          tail -3 out/*.qemu.log out/vncviewer.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: display-test
          path: |
            out/*.png
            out/clicks/*.png
            out/*.txt
            out/*.log
          retention-days: 7
